name: Build upstream release

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v5
        with:
          repository: k1tbyte/Wand-Enhancer
          ref: master
          fetch-depth: 1

      - name: Resolve upstream version
        id: source
        shell: pwsh
        env:
          MANUAL_TAG_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.run_number) || '' }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $shortSha = $sourceSha.Substring(0, 12)
          $assemblyInfo = Get-Content 'WandEnhancer/Properties/AssemblyInfo.cs' -Raw
          $match = [regex]::Match(
            $assemblyInfo,
            '(?m)^\s*\[assembly:\s*AssemblyVersion\("(?<version>[^"]+)"\)\]'
          )
          if (-not $match.Success) {
            throw 'AssemblyVersion was not found in the upstream source.'
          }

          $version = $match.Groups['version'].Value
          "sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=upstream-$version-$shortSha$env:MANUAL_TAG_SUFFIX" >> $env:GITHUB_OUTPUT

      - name: Remove stale upstream documentation reference
        shell: pwsh
        run: |
          if ((Test-Path 'CLAUDE.md') -and -not (Test-Path 'WandEnhancer/Core/EnhancerConfig.cs')) {
            $path = 'CLAUDE.md'
            $content = Get-Content $path -Raw
            $content = $content.Replace('`Core/EnhancerConfig.cs`, ', '')
            Set-Content -Path $path -Value $content -NoNewline
          }

      - name: Skip already published commit
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Set up pnpm
        if: steps.release.outputs.exists != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - name: Set up Node.js
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build executable
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: ./build.ps1 -Configuration Release -EnableUpdateNotifications

      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          name: WandEnhancer ${{ steps.source.outputs.version }} (${{ steps.source.outputs.short_sha }})
          body: |
            Automated build from upstream commit [${{ steps.source.outputs.sha }}](https://github.com/k1tbyte/Wand-Enhancer/commit/${{ steps.source.outputs.sha }}).

            This executable was built by GitHub Actions from the upstream source.
          files: WandEnhancer/bin/Release/WandEnhancer.exe
          fail_on_unmatched_files: true
          make_latest: true

  cleanup:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Remove old automated releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          releases="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("upstream-")) | [.created_at, .id, .tag_name] | @tsv' \
            | sort -r)"

          keep=0
          while IFS=$'\t' read -r created_at release_id tag_name; do
            [ -n "${release_id:-}" ] || continue
            keep=$((keep + 1))
            if [ "$keep" -le 1 ]; then
              continue
            fi

            echo "Deleting old automated release: ${tag_name}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag_name}" || true
          done <<< "$releases"

      - name: Remove old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/upstream-release.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | [.created_at, .id] | @tsv' \
            | sort -r)"

          keep=0
          while IFS=$'\t' read -r created_at run_id; do
            [ -n "${run_id:-}" ] || continue
            keep=$((keep + 1))
            if [ "$keep" -le 3 ] || [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi

            echo "Deleting old workflow run: ${run_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done <<< "$runs"
